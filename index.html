<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沈一帅</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: linear-gradient(180deg, #ffffff 0%, #f8f8fa 50%, #f2f2f5 100%);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
}

h1 {
    font-size: clamp(3rem, 12vw, 8rem);
    font-weight: 200;
    letter-spacing: 0.15em;
    color: #1d1d1f;
    opacity: 0.85;
    text-shadow: 0 0 60px rgba(0,0,0,0.03);
    animation: breathe 6s ease-in-out infinite;
}

@keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 0.92; transform: scale(1.01); }
}

/* 底部极淡装饰线 */
.line {
    position: absolute;
    bottom: 15%;
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d2d2d7, transparent);
}
</style>
</head>
<body>
<h1>沈一帅</h1>
<div class="line"></div>
</body>
</html>
