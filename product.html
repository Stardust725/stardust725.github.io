<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沈一帅 — 新品发布</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #000;
    height: 100vh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    cursor: pointer;
    user-select: none;
}

/* 初始页面 */
#intro {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    transition: opacity 0.8s ease;
    z-index: 10;
}

#intro.hidden {
    opacity: 0;
    pointer-events: none;
}

#intro h1 {
    font-size: clamp(3rem, 12vw, 8rem);
    font-weight: 700;
    letter-spacing: 0.12em;
    background: linear-gradient(180deg, #f0f0f0 0%, #86868b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

#intro .hint {
    margin-top: 2rem;
    font-size: 0.85rem;
    color: #86868b;
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeIn 2s ease 1s forwards;
}

@keyframes fadeIn { to { opacity: 1; } }

/* 产品展示页 */
#product {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
    z-index: 20;
}

#product.show {
    opacity: 1;
    pointer-events: all;
}

#product .label {
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: #86868b;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.8s ease 0.3s;
}

#product.show .label {
    transform: translateY(0);
    opacity: 1;
}

#product h2 {
    font-size: clamp(2.5rem, 10vw, 6rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 50%, #ffffff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s ease-in-out infinite;
    transform: scale(0.9);
    opacity: 0;
    transition: all 0.8s ease 0.6s;
}

#product.show h2 {
    transform: scale(1);
    opacity: 1;
}

#product .tagline {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 300;
    color: #86868b;
    letter-spacing: 0.05em;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.8s ease 0.9s;
}

#product.show .tagline {
    transform: translateY(0);
    opacity: 1;
}

#product .specs {
    margin-top: 3rem;
    display: flex;
    gap: 3rem;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.8s ease 1.2s;
}

#product.show .specs {
    transform: translateY(0);
    opacity: 1;
}

.spec {
    text-align: center;
}

.spec .number {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    color: #fff;
}

.spec .unit {
    font-size: 0.8rem;
    color: #86868b;
    margin-top: 0.3rem;
}

/* 底部小字 */
#product .footer-note {
    position: absolute;
    bottom: 8%;
    font-size: 0.7rem;
    color: #424245;
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 1s ease 2s;
}

#product.show .footer-note {
    opacity: 1;
}

@keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}
</style>
</head>
<body onclick="launchProduct()">

<div id="intro">
    <h1>沈一帅</h1>
    <div class="hint">点击查看</div>
</div>

<div id="product">
    <div class="label">全新推出</div>
    <h2>沈一帅</h2>
    <div class="tagline">帅，是一种本能。</div>
    <div class="specs">
        <div class="spec">
            <div class="number">100%</div>
            <div class="unit">颜值拉满</div>
        </div>
        <div class="spec">
            <div class="number">∞</div>
            <div class="unit">魅力值</div>
        </div>
        <div class="spec">
            <div class="number">0</div>
            <div class="unit">缺点</div>
        </div>
    </div>
    <div class="footer-note">设计于中国 · 2026</div>
</div>

<script>
function launchProduct() {
    const intro = document.getElementById('intro');
    const product = document.getElementById('product');
    intro.classList.add('hidden');
    setTimeout(() => {
        product.classList.add('show');
    }, 400);
}
</script>

</body>
</html>
